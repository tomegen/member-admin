name: Build and Release

# push to main: run the tests and build both apps (no release)
# manual run with a version: additionally publish the release (Windows installer + zip, macOS dmg);
# the download page (docs/index.html) links to releases/latest/download/<file name>
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version / tag name (e.g. 0.1.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest   # Apple Silicon
            name: mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen   # tests and smoke test need no screen

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements-dev.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run tests
      run: |
        python tests/test_regressions.py
        python tests/test_ui.py
        python tests/test_store.py
        python tests/test_import.py

    - name: Install Inno Setup (Windows installer)
      if: matrix.name == 'windows'
      run: choco install innosetup --no-progress -y

    - name: Build app and packages
      run: python build.py "${{ inputs.version || 'dev' }}"

    # installs like a user would (no admin rights), then starts the installed app: it loads the example list
    # and writes every export once (exit code 0 = ok)
    - name: Install and smoke test (Windows)
      if: matrix.name == 'windows'
      shell: pwsh
      run: |
        $setup = Start-Process -FilePath "release\Mitgliederverwaltung-Windows-Setup.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
        if ($setup.ExitCode -ne 0) { throw "Installer failed with exit code $($setup.ExitCode)" }
        $exe = Join-Path $env:LOCALAPPDATA "Programs\Mitgliederverwaltung\Mitgliederverwaltung.exe"
        if (-not (Test-Path $exe)) { throw "App not found after installation: $exe" }
        $process = Start-Process -FilePath $exe -ArgumentList "--smoke-test", "$PWD\example_file.xlsx" -Wait -PassThru
        if ($process.ExitCode -ne 0) { throw "Smoke test failed with exit code $($process.ExitCode)" }

    - name: Smoke test disk image (macOS)
      if: matrix.name == 'mac'
      run: |
        hdiutil attach release/Mitgliederverwaltung-Mac.dmg -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg"
        "$RUNNER_TEMP/dmg/Mitgliederverwaltung.app/Contents/MacOS/Mitgliederverwaltung" --smoke-test example_file.xlsx
        hdiutil detach "$RUNNER_TEMP/dmg"

    # pictures of every tab with the example list, to see the app on each system (download: run → Artifacts)
    - name: Screenshots
      continue-on-error: true
      timeout-minutes: 5
      shell: bash
      env:
        QT_QPA_PLATFORM: ${{ matrix.name == 'windows' && 'windows' || 'offscreen' }}   # real Windows fonts
      run: |
        if [ "${{ matrix.name }}" = windows ]; then app=release/Mitgliederverwaltung/Mitgliederverwaltung.exe
        else app=release/Mitgliederverwaltung.app/Contents/MacOS/Mitgliederverwaltung; fi
        "$app" --screenshots=screenshots example_file.xlsx

    - name: Upload screenshots
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: Screenshots-${{ matrix.name }}
        path: screenshots/

    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: Mitgliederverwaltung-${{ matrix.name }}
        path: |
          release/Mitgliederverwaltung-Windows-Setup.exe
          release/Mitgliederverwaltung-Windows.zip
          release/Mitgliederverwaltung-Mac.dmg
        if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release with the default GITHUB_TOKEN
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: Mitgliederverwaltung-*
        path: packages
        merge-multiple: true

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.version }}
        name: Release ${{ inputs.version }}
        files: packages/*
